swagger: "2.0"
info:
  version: 1.0.0
  title: kiln-api
  description: Node.js middleware to integrate Forms Foundry Kiln, ICM and communications layer.

basePath: /api

tags:
  - name: Default
    description: Health check and fallback routes
  - name: Kiln Renderer
    description: Endpoints for rendering forms in Kiln
  - name: Communications Layer
    description: Endpoints for interacting with the communications layer
  - name: ICM User Interface
    description: Endpoints available for ICM user interface interactions
  - name: Kiln Interface
    description: Endpoints for Kiln interface operations
  - name: Examples
    description: Example endpoints for testing

consumes:
  - application/json
produces:
  - application/json

paths:
  /:
    get:
      tags:
        - Default
      description: Health check endpoint
      responses:
        200:
          description: Returns API status
    post:
      tags:
        - Default
      description: Create endpoint for testing
      parameters:
        - in: body
          name: data
          schema:
            type: object
      responses:
        201:
          description: Create endpoint hit
  /{id}:
    get:
      tags:
        - Default
      description: Get by ID endpoint for testing
      parameters:
        - in: path
          name: id
          type: string
          required: true
      responses:
        200:
          description: Returns message with ID

  /view:
    get:
      tags:
        - Kiln Renderer
        - ICM User Interface
      description: Render a view-only form
      responses:
        200:
          description: Form rendered
  /edit:
    get:
      tags:
        - Kiln Renderer
        - ICM User Interface
      description: Render an editable and saveable form (GET)
      responses:
        200:
          description: Form rendered

  /generateForm:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      description: Generate a form
      parameters:
        - in: body
          name: data
          schema:
            type: object
      responses:
        200:
          description: Form generated

  /saveICMData:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      description: Save data to ICM Siebel REST API
      parameters:
        - in: body
          name: icmData
          required: true
          schema:
            type: object
      responses:
        200:
          description: ICM data saved successfully

  /loadICMData:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      description: Load data from ICM
      parameters:
        - in: body
          name: icmRequest
          required: true
          schema:
            type: object
      responses:
        200:
          description: ICM data loaded successfully

  /unlockICMData:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      description: Clear locked flag in ICM
      parameters:
        - in: body
          name: unlockRequest
          required: true
          schema:
            type: object
      responses:
        200:
          description: Locked flag cleared successfully

  /loadSavedJson:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      description: Load saved JSON form data
      parameters:
        - in: body
          name: jsonRequest
          required: true
          schema:
            type: object
      responses:
        200:
          description: JSON data loaded successfully

  /pdfRender/{pdfTemplateId}:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      description: Render a PDF from form data using a specific template
      parameters:
        - in: path
          name: pdfTemplateId
          type: string
          required: true
          description: The ID of the PDF template to use
        - in: body
          name: pdfData
          required: false
          schema:
            type: object
      produces:
        - application/pdf
        - application/json
      responses:
        200:
          description: PDF rendered successfully
        400:
          description: Bad request - missing or invalid parameters
        500:
          description: Internal server error

  /loadPortalForm:
    post:
      tags:
        - Communications Layer
        - ICM User Interface
      description: Load a portal form
      parameters:
        - in: body
          name: formData
          required: true
          schema:
            type: object
      responses:
        200:
          description: Portal form loaded successfully
        400:
          description: Bad request - invalid data
        404:
          description: Portal form not found
        500:
          description: Internal server error

  /submitForPortalAction:
    post:
      tags:
        - Communications Layer
        - ICM User Interface
      description: Submit portal action
      parameters:
        - in: body
          name: actionData
          required: true
          schema:
            type: object
            properties:
              tokenId:
                type: string
                description: Token ID for authentication
              savedForm:
                type: string
                description: Saved form data
              config:
                type: object
                description: Action configuration
      responses:
        200:
          description: Portal action submitted successfully
        400:
          description: Bad request - missing required fields
        401:
          description: Unauthorized
        500:
          description: Internal server error

  /examples:
    get:
      tags:
        - Examples
      description: Get all examples
      responses:
        200:
          description: Returns array of examples
    post:
      tags:
        - Examples
      description: Create a new example
      parameters:
        - in: body
          name: example
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
      responses:
        201:
          description: Example created successfully
  /examples/{id}:
    get:
      tags:
        - Examples
      description: Get example by ID
      parameters:
        - in: path
          name: id
          type: integer
          required: true
      responses:
        200:
          description: Returns example object
        404:
          description: Example not found

  /generatePortalForm:
    post:
      tags:
        - Communications Layer
      summary: Generate portal form
      description: Generates a portal form JSON payload.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: payload
          required: true
          schema:
            type: object
      responses:
        200:
          description: Portal form generated
          schema:
            type: object
        400:
          description: Bad request
        401:
          description: Unauthorized
        500:
          description: Internal server error

  /generateNewTemplate:
    post:
      tags:
        - Communications Layer
      summary: Generate a new form template in Comm Layer and save to ICM
      description: >
        Proxies the request to Communication Layer's POST /generateNewTemplate.
        The body should contain the same arguments accepted by the generate flow.
        On success, returns { errorCode: 0, message }. On failure, returns { error }.
      operationId: generateNewTemplate
      parameters:
        - in: body
          name: body
          description: JSON payload for generation
          required: true
          schema:
            type: object
            additionalProperties: true
            properties:
              attachmentId:
                type: string
                description: ICM attachment identifier (required)
                example: "1-4ZYB80E"
              formId:
                type: string
                description: Form template identifier (required)
                example: "CF8787"
              area:
                type: string
                description: Business area (validated against ICM metadata)
                example: "Service Request"
              CaseId:
                type: string
                description: Optional Case identifier
                example: "1-4ZYB34V"
              ContactId:
                type: string
                description: Optional Contact identifier
              SRId:
                type: string
                description: Optional Service Request identifier
            required:
              - attachmentId
              - formId
              - area
      responses:
        200:
          description: Form successfully generated
          schema:
            type: object
            required: [errorCode, message]
            properties:
              errorCode:
                type: integer
                example: 0
              message:
                type: string
                example: Successfully generated the form
        400:
          description: Invalid request or generation failure
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                example: The form cannot be generated.  

  /loadBoundForm:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      summary: Load form data with binding applied
      description: Loads form data and applies data binding logic in the backend for better separation of concerns
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: formRequest
          required: true
          schema:
            type: object
            properties:
              attachmentId:
                type: string
                description: The attachment ID for the form
              username:
                type: string
                description: Username for authentication
              token:
                type: string
                description: Authentication token
              isPortalIntegrated:
                type: boolean
                description: Whether to use portal integration
            required:
              - attachmentId
      responses:
        200:
          description: Form data loaded and bound successfully
          schema:
            type: object
            properties:
              form_definition:
                type: object
                description: Form definition with data binding applied
              data:
                type: object
                description: Original saved data
              metadata:
                type: object
                description: Form metadata
              bound:
                type: boolean
                description: Flag indicating data has been bound
        400:
          description: Bad request - missing required parameters
        401:
          description: Unauthorized - authentication required
        500:
          description: Internal server error

  /bindPreviewForm:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      summary: Bind data to form definition for preview
      description: Applies data binding to form definition and data for preview functionality in kiln-v2
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: requestBody
          required: true
          schema:
            type: object
            properties:
              formData:
                type: object
                description: Form data containing form_definition, data, and metadata
                properties:
                  form_definition:
                    type: object
                    description: The form definition JSON
                  data:
                    description: The saved form data to bind
                  metadata:
                    description: Form metadata
            required:
              - formData
      responses:
        200:
          description: Form data bound successfully
          schema:
            type: object
            properties:
              form_definition:
                type: object
                description: Form definition with data binding applied
              data:
                type: object
                description: Original saved data
              metadata:
                type: object
                description: Form metadata
              bound:
                type: boolean
                description: Flag indicating data has been bound
        400:
          description: Bad request - missing formData parameter
        500:
          description: Internal server error

  /saveFormData:
    post:
      tags:
        - Communications Layer
        - Kiln Interface
      summary: Unified save form data endpoint
      description: Handles both save and save-and-close actions with server-side orchestration. Replaces separate saveICMData and unlockICMData calls with unified backend logic.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: saveRequest
          required: true
          schema:
            type: object
            additionalProperties: true
      responses:
        200:
          description: Form data saved successfully
          schema:
            type: object
            properties:
              saved:
                type: boolean
                description: Whether the save operation succeeded
              unlocked:
                type: boolean
                description: Whether unlock succeeded (only present for save_and_close)
              action:
                type: string
                description: The action that was performed
        400:
          description: Bad request - missing required fields
        401:
          description: Unauthorized - authentication required
        500:
          description: Internal server error

  /generatePDFFromJson:
    post:
      tags:
        - Communications Layer
      summary: Generate a PDF from form JSON via Communication Layer
      description: Accepts either raw form JSON (server base64-encodes) or { attachment <base64> }.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: false
          schema:
            type: object
            additionalProperties: true
            properties:
              attachment:
                type: string
                description: Base64-encoded JSON expected by the Communication Layer
      responses:
        200:
          description: PDF generated
          schema:
            type: object
            properties:
              errorCode:
                type: integer
              errorMessage:
                type: string
              pdf:
                type: string
                description: Base64-encoded PDF
        400:
          description: Bad request
          schema:
            type: object
            properties:
              error:
                type: string
        502:
          description: Upstream Communication Layer error
          schema:
            type: object
            properties:
              error:
                type: string
        500:
          description: Server error
          schema:
            type: object
            properties:
              error:
                type: string


