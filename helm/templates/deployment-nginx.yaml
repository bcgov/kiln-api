{{- if .Values.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kilnAPI.fullname" . }}-nginx
  labels:
    app.kubernetes.io/name: {{ include "kilnAPI.name" . }}-nginx
    {{- include "kilnAPI.labels" . | nindent 4 }}
spec:
  {{- if not .Values.nginx.autoscaling.enabled }}
  replicas: {{ .Values.nginx.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kilnAPI.name" . }}-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kilnAPI.name" . }}-nginx
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.containerPort | default 8080 }}
          {{- with .Values.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if and .Values.nginx.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.nginx.probes.liveness.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.nginx.probes.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.nginx.probes.liveness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.nginx.probes.liveness.failureThreshold | default 3 }}
          {{- end }}
          {{- if and .Values.nginx.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.nginx.probes.readiness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.nginx.probes.readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.nginx.probes.readiness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.nginx.probes.readiness.failureThreshold | default 3 }}
          {{- end }}

          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "kilnAPI.fullname" . }}-nginx-conf

      {{- with .Values.nginx.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nginx.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nginx.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
